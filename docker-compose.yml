# docker-compose.yml — Deployment profile (CLIP + Qwen only)
#
# Usage:
#   docker compose up --build
#
# Requires NVIDIA Container Toolkit on the host.
# Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlm-disaster-backend:latest
    container_name: vlm_backend
    restart: unless-stopped
    environment:
      - ACTIVE_MODELS=clip,qwen
      - QUANTIZE_QWEN=true
      - LOG_LEVEL=INFO
      # Add OPENAI_API_KEY here if you want GPT-4V available
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      # Cache HuggingFace model weights across restarts — avoids re-downloading
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vlm-disaster-frontend:latest
    container_name: vlm_frontend
    restart: unless-stopped
    environment:
      # Points the built frontend at the backend container
      - VITE_API_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache:
    driver: local
