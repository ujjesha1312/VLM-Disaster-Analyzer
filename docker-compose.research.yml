# docker-compose.research.yml — Research profile (all four models)
#
# Usage:
#   docker compose -f docker-compose.research.yml up --build
#
# Requires a GPU with ≥ 20 GB VRAM to run all four models simultaneously.
# Individual models use lazy loading — VRAM is allocated on first inference.

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlm-disaster-backend:research
    container_name: vlm_backend_research
    restart: unless-stopped
    environment:
      - ACTIVE_MODELS=clip,blip2,llava,qwen
      - QUANTIZE_QWEN=true
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vlm-disaster-frontend:research
    container_name: vlm_frontend_research
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  hf_cache:
    driver: local
